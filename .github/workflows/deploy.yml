name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare
  cancel-in-progress: false
# Checks run in parallel (same jobs as ci.yml); `deploy` runs only if all of them
# succeed and ships the exact build the `build` job produced and checked.
jobs:
  lint:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
  typecheck:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm check:bundles
      # The Vite plugin leaves build/ plus .wrangler/deploy/config.json (a hidden
      # file that wrangler follows to build/server/wrangler.json).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-build
          path: |
            build/
            .wrangler/deploy/config.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  test:
    if: github.ref == 'refs/heads/main'
    name: test (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/5
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [lint, typecheck, build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-build
          path: .
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # A re-run of an older run must never roll production back to an older build.
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$head" ]; then
            echo "::error::No se pudo leer main en origin."
            exit 1
          fi
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved past $GITHUB_SHA ($head). Deploy skipped; the newer run deploys it."
            exit 0
          fi
          node scripts/check-fork-config.mjs
          if grep -q '"database_id": *"00000000-0000-0000-0000-000000000000"' wrangler.jsonc; then
            echo "::notice::Run the Setup workflow first (Actions > Setup > Run workflow). Deploy skipped."
            exit 0
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltan CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID (ver DEPLOY.md, paso 3)."
            exit 1
          fi
          # Same order as the deploy script in package.json: migrations, then the Worker. The
          # build and check:bundles already ran (and passed) in the build job.
          pnpm exec wrangler d1 migrations apply DB --remote
          pnpm exec wrangler deploy
